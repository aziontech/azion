name: Deploy to Stage

on:
  push:
    branches:
      - main
  # Also runnable on demand against any ref, so a stage build never
  # requires a merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.8
    env:
      CGO_ENABLED: 0 # Statically linked

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setting up a secure repository
        run: git config --global --add safe.directory /__w/azion/azion

      - name: Bump version and push tag
        id: tag_ver
        uses: anothrNick/github-tag-action@3272e7a58f6c71ee9ede35f53b114e1bb9a91347 # 1.37.0
        env:
          # This pipeline only ever mints pre-release tags (X.Y.Z-dev.N), the way it
          # always did when it ran off the dev branch. deploy_prod.yml is the single
          # producer of clean X.Y.Z release tags.
          #
          # RELEASE_BRANCHES is matched against the current branch as an unanchored
          # bash regex, and a branch matching none of the entries stays a pre-release,
          # so this value must simply never match a real branch name. It cannot be
          # left unset: the action then defaults to "master,main", which would make
          # every push to main a clean release tag.
          RELEASE_BRANCHES: __no_release_from_stage__
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_SUFFIX: dev

      - name: Refresh git
        run: git fetch --tags

      - name: Build
        env:
          AZION_API: ${{ secrets.AZION_API_STAGE }}
          AZION_SSO: ${{ secrets.AZION_SSO_STAGE }}
          STORAGE_API: ${{ secrets.STORAGE_API_STAGE }}
          CONSOLE_URL: ${{ secrets.CONSOLE_STAGE }}
          AZION_API_V4: ${{ secrets.AZION_API_V4_STAGE }}
          GOFLAGS: -tags=stage
        run: make build ENVFILE=./env/stage

      - name: Cross-build
        env:
          AZION_API: ${{ secrets.AZION_API_STAGE }}
          AZION_SSO: ${{ secrets.AZION_SSO_STAGE }}
          STORAGE_API: ${{ secrets.STORAGE_API_STAGE }}
          CONSOLE_URL: ${{ secrets.CONSOLE_STAGE }} 
          AZION_API_V4: ${{ secrets.AZION_API_V4_STAGE }}
          GOFLAGS: -tags=stage
        run: make cross-build ENVFILE=./env/stage

      - name: Install AWS CLI
        run: |
          apt update
          apt install -y awscli

      - name: Configure AWS Credentials (azion-downloads)
        uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838 # v1
        with:
          aws-access-key-id: ${{ secrets.CLI_S3_DOWNLOADS_ID }}
          aws-secret-access-key: ${{ secrets.CLI_S3_DOWNLOADS_SECRET }}
          aws-region: us-east-1

      - name: Upload to azion-downloads stage dir
        run: |
          while read spec; \
          do\
            distro=$(echo ${spec} | cut -d/ -f1);\
            goarch=$(echo ${spec} | cut -d/ -f2);\
            arch=$(echo ${goarch} | sed 's/386/x86_32/g; s/amd64/x86_64/g; s/arm$/arm32/g;');\
            cp dist/$distro/$arch/azion* dist/$distro/$arch/azion;
            aws s3 cp --no-progress --recursive \
              --exclude "*" --include "azion*" \
              dist/$distro/$arch/ s3://azion-downloads/stage/$distro/$arch/; \
          done < BUILD
